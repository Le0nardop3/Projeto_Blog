{% extends 'base.html' %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Login</h3>

        {% if error_message %}
            <div class="alert alert-danger text-center" role="alert">
                Nome ou senha inválidos
            </div>
        {% endif %}
        {% if error_message2 %}
            <div class="alert alert-warning text-center" role="alert">
                Faça login
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group mb-3">
                <label for="id_nome">Usuário:</label>
                <input type="text" id="id_nome" name="nome" class="form-control" placeholder="Nome..." required>
            </div>
            <div class="form-group mb-3">
                <label for="id_senha">Senha:</label>
                <input type="password" id="id_senha" name="senha" class="form-control" placeholder="Senha..." required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

        <div class="text-center mt-3">
            <p>Não tem uma conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
        </div>
    </div>
</div>
{% endblock %}
