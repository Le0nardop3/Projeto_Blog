{% extends 'base.html' %}
{% block content %}

<section class="Estrutura">
    <h1>Publicar</h1><br>
    <div class="Atividade">
        <form action="{% url 'publicar' %}" class="form" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Publicar</button>
        </form>
    </div>
</section>

<style>
    .Estrutura {
        margin: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .Atividade {
        width: 95%;
        background-color: rgba(112, 112, 106, 0.274);
        display: flex;
        height: auto;
        padding: 20px;
        align-items: center;
        justify-content: center;
    }

    .form {
        width: 100%;
        max-width: 600px;
    }

    .form input[type="text"],
    .form textarea,
    .form input[type="file"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
    }

    .form button {
        padding: 10px 20px;
        background-color: #444;
        color: white;
        border: none;
        cursor: pointer;
    }

    @media screen and (max-width: 768px) {
        .form {
            width: 90%;
        }
    }
</style>

{% endblock %}
